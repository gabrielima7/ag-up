name: CI / DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-security:
    name: Build, Test & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache: true

      - name: Verify Go Modules Integrity
        run: go mod verify

      - name: Build Binary
        run: go build -v ./...

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Security AST Scan (gosec)
        uses: securego/gosec@master
        with:
          args: './...'

      - name: Run Tests with Race Detector
        run: go test -v -race -coverprofile=coverage.out ./...

